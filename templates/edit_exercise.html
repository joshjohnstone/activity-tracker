{% extends "base.html" %}

{% block content %}

<div class="nav">
    <a href="/">Log Activity</a>
    <a href="/history">History</a>
    <a href="/analytics">Analytics</a>
    <a href="/exercises">Exercises</a>
</div>

<h2>Edit Exercise</h2>

<form method="POST" action="/edit_exercise/{{ exercise.id }}" class="exercise-form">

    <label for="name">Exercise Name:</label>
    <input type="text" name="name" id="name" value="{{ exercise.name }}" required>

    <label for="activity_category">Activity Category:</label>
    <select name="activity_category" id="activity_category">
        {% for category in ACTIVITY_CATEGORIES %}
            <option value="{{ category }}" {% if category == exercise.activity_category %}selected{% endif %}>
                {{ category }}
            </option>
        {% endfor %}
    </select>

    <div id="lift-category-wrapper">
        <label for="lift_category">Lift Category:</label>
        <select name="lift_category" id="lift_category">
            <option value="" {% if not exercise.lift_category %}selected{% endif %}>None</option>
            {% for category in LIFT_CATEGORIES %}
                <option value="{{ category }}" {% if category == exercise.lift_category %}selected{% endif %}>
                    {{ category }}
                </option>
            {% endfor %}
        </select>
    </div>

    <label for="tracking_type">Tracking Type:</label>
    <select name="tracking_type" id="tracking_type">
        {% for tracking_type in TRACKING_TYPES %}
            <option value="{{ tracking_type }}" {% if tracking_type == exercise.tracking_type %}selected{% endif %}>
                {{ tracking_type_labels.get(tracking_type, tracking_type) }}
            </option>
        {% endfor %}
    </select>

    <div id="dumbbell-pair-wrapper">
        <label for="is_dumbbell_pair">
            <input type="checkbox" name="is_dumbbell_pair" id="is_dumbbell_pair" {% if exercise.is_dumbbell_pair %}checked{% endif %}>
            Uses a pair of dumbbells (doubles logged weight for volume/PRs)
        </label>
    </div>

    <button type="submit">Save Changes</button>

</form>

{% endblock %}

{% block scripts %}

<script>
    const activityCategorySelect = document.getElementById("activity_category");
    const liftCategoryWrapper = document.getElementById("lift-category-wrapper");
    const liftCategorySelect = document.getElementById("lift_category");
    const trackingTypeSelect = document.getElementById("tracking_type");
    const dumbbellPairWrapper = document.getElementById("dumbbell-pair-wrapper");
    const isDumbbellPairCheckbox = document.getElementById("is_dumbbell_pair");

    function syncDumbbellPairVisibility() {
        if (trackingTypeSelect.value === "weighted_reps") {
            dumbbellPairWrapper.style.display = "block";
        } else {
            dumbbellPairWrapper.style.display = "none";
            isDumbbellPairCheckbox.checked = false;
        }
    }

    function syncLiftCategoryVisibility() {
        if (activityCategorySelect.value === "Strength") {
            liftCategoryWrapper.style.display = "block";
        } else {
            liftCategoryWrapper.style.display = "none";
            liftCategorySelect.value = "";
        }
    }

    activityCategorySelect.addEventListener("change", syncLiftCategoryVisibility);
    trackingTypeSelect.addEventListener("change", syncDumbbellPairVisibility);

    syncLiftCategoryVisibility();
    syncDumbbellPairVisibility();
</script>

{% endblock %}
